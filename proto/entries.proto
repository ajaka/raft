syntax = "proto3";

package rpc;

option go_package = "rpc/gen;rpc";

import "propose.proto";

message Entry{
    uint64 index = 1;
    uint64 term =2;
    EntryType type =3;
    bytes payload =4;
}
message AppendEntriesRequest{
    uint64 term = 1;
    string leaderId=2;
    uint64 lastLogIndex =3;
    uint64 lastLogTerm =4;
    repeated Entry entries =5;
    uint64 leaderCommit =6;
}

message AppendEntriesResponse{
    uint64 lastLogIndex =1;
    uint64 lastLogTerm =2;
    bool ok =3;
    string leaderId =4;
    uint64 term = 5;
}
